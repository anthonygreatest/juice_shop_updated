llm:
  openrouter:
    http_client:
      api_url: https://openrouter.ai/api/v1
      api_token: ${LLM__HTTP_CLIENT__API_TOKEN}

    meta:
      model: mistralai/mistral-7b-instruct:free
      max_tokens: 15000
      temperature: 0.3

vcs:
  github:
    http_client:
      api_url: https://api.github.com
      api_token: ${VCS__HTTP_CLIENT__API_TOKEN}

    pipeline:
      owner: ${VCS__PIPELINE__OWNER}
      repo: ${VCS__PIPELINE__REPO}
      pull_number: ${VCS__PIPELINE__PULL_NUMBER}