name: 🤖 AI Review

on:
  pull_request:
  workflow_dispatch:

jobs:
  ai-review:
    name: Run AI Review
    runs-on: ubuntu-latest

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - name: 🧱 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⏳ Wait for Ollama
        run: |
          echo "Waiting for Ollama..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/version; then
              echo "Ollama is ready"
              exit 0
            fi
            sleep 3
          done
          echo "Ollama not ready"
          exit 1

      - name: 📦 Pull model
        run: |
          curl -X POST http://localhost:11434/api/pull \
            -H "Content-Type: application/json" \
            -d '{"model": "mistral"}'

      - name: 🔥 Warm up
        run: |
          curl -s -X POST http://localhost:11434/api/chat \
            -H "Content-Type: application/json" \
            -d '{
              "model":"mistral",
              "stream":false,
              "messages":[{"role":"user","content":"hello"}]
            }'

      - name: 🚀 Run AI Review
        uses: Nikita-Filonov/ai-review@v0.27.0
        env:
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event.pull_request.number }}